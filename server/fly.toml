app = 'nut-november-api'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  # Relative to this config; the build context remains the repository root.
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  DATA_DIR = '/data'
  PUBLIC_API_URL = 'https://api.nutnovember.org'
  CORS_ORIGINS = 'https://nutnovember.org,https://www.nutnovember.org'

[[mounts]]
  source = 'donation_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
