name: Checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: npm test
      - run: npm run api:test
      - run: npm run api:typecheck
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
